name: QA
on:
  pull_request:
  push:
    branches: ['dev/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/rotations.test.cjs
      - run: npm run test:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: |
            artifacts/
            test-results/
