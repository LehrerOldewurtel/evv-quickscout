<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f5f5f7"><title>EVV QuickScout</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><script src="version.js"></script></head><body>
<header class="appHeader"><div class="brandRow"><span class="brand">EVV QuickScout</span><span id="buildLabel" class="build">V?</span></div><div class="scoreline"><div class="team home"><span id="homeName">EVV</span><strong id="homeScore">0</strong></div><div class="center"><span id="setBadge">S1</span><span id="rotationBadge">R1</span></div><div class="team away"><strong id="oppScore">0</strong><span id="oppNameHead">Gegner</span></div></div><div class="statusline"><span id="phase">K2</span><span id="serveText">EVV Aufschlag</span><span id="serverText">Aufschlag: –</span></div><div id="lineups" class="lineups"></div></header>
<main><section id="setup" class="card setupCard"><div class="sectionTitle"><div><div class="eyebrow">MATCH SETUP</div><h2>Spiel einrichten</h2></div><span id="setupVersion" class="versionPill">V?</span></div><div class="grid2"><label>Gegner<input id="oppName" value="Gegner"></label><label>Gegner-Zuspieler #<input id="oppSetter" inputmode="numeric" placeholder="z. B. 7"></label><label>Gegner-Libero 1 #<input id="oppLibero1" inputmode="numeric" placeholder="z. B. 2"></label><label>Gegner-Libero 2 #<input id="oppLibero2" inputmode="numeric" placeholder="z. B. 12"></label><label>Startrotation<select id="startRotation"><option>R1</option><option>R2</option><option>R3</option><option>R4</option><option>R5</option><option>R6</option></select></label></div><h3>Gegner-Annahme</h3><div class="grid4"><input id="oppR1" placeholder="# A1"><input id="oppR2" placeholder="# A2"><input id="oppR3" placeholder="# A3"><input id="oppR4" placeholder="# A4"></div><h3>EVV Start-Sechs</h3><div class="grid2"><label>Libero auf dem Feld<select id="evvLiberoOnCourt"><option value="">Kein Libero</option><option value="amar">Amar</option><option value="alex">Alexandra</option></select></label><label>Libero ersetzt<select id="evvLiberoReplaces"><option value="">Niemand</option><option value="janik">Janik</option><option value="dirk">Dirk</option><option value="michael">Michael</option><option value="jonas">Jonas</option><option value="maksym">Maksym</option><option value="johann">Johann</option></select></label></div><div id="startSix" class="grid3"></div><div class="grid2 startButtons"><button id="startReceive" class="primary">Gegner-Aufschlag · K1</button><button id="startServe" class="primary">EVV-Aufschlag · K2</button></div></section>
<section class="card tabs"><button data-tab="rally" class="active">Rallye</button><button data-tab="opponent">Gegner</button><button data-tab="coach">Coach</button><button data-tab="stats">Auswertung</button></section><section id="setNav" class="card setnav"></section><section id="flow" class="card flowCard"><h2>Bereit</h2><p>Spiel einrichten und starten.</p></section><section id="recent" class="card"></section></main>
<nav class="bottom"><button id="undo">↶ Undo</button><button id="scoreFix">± Punkt</button><button id="substitute">⇄ Wechsel</button><button id="timeout">⏱ Auszeit</button><button id="voiceBtn">🎙 Sprache</button><button id="nextSet">Satz +</button></nav><div id="modal" class="modal hidden"><div id="modalBox" class="modalbox"></div></div><div id="toast" class="toast hidden"></div><script src="app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
