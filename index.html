<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>EVV QuickScout V7</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="scoreline">
    <div><span id="homeName">EVV</span> <strong id="homeScore">0</strong></div>
    <div class="center"><span id="setBadge">S1</span><span id="rotationBadge">R1</span></div>
    <div><strong id="oppScore">0</strong> <span id="oppNameHead">Gegner</span></div>
  </div>
  <div class="statusline"><span id="phase">K2</span><span id="serveText">EVV Aufschlag</span></div>
  <div id="lineups" class="lineups"></div>
</header>

<main>
<section id="setup" class="card">
  <h2>Spiel einrichten · V7</h2>
  <div class="grid2">
    <label>Gegner<input id="oppName" value="Gegner"></label>
    <label>Gegner-Zuspieler #<input id="oppSetter" inputmode="numeric" placeholder="z. B. 7"></label>
    <label>Gegner-Libero #<input id="oppLibero" inputmode="numeric" placeholder="z. B. 2"></label>
    <label>Startrotation
      <select id="startRotation"><option>R1</option><option>R2</option><option>R3</option><option>R4</option><option>R5</option><option>R6</option></select>
    </label>
  </div>
  <h3>Gegner-Annahme</h3>
  <div class="grid4">
    <input id="oppR1" placeholder="# A1"><input id="oppR2" placeholder="# A2"><input id="oppR3" placeholder="# A3"><input id="oppR4" placeholder="# A4">
  </div>
  <h3>EVV Start-Sechs</h3>
  <div id="startSix" class="grid3"></div>
  <div class="grid2">
    <button id="startReceive" class="primary">Start · Gegner Aufschlag · K1</button>
    <button id="startServe" class="primary">Start · EVV Aufschlag · K2</button>
  </div>
</section>

<section class="card tabs">
  <button data-tab="rally" class="active">Rallye</button>
  <button data-tab="opponent">Gegner</button>
  <button data-tab="coach">Coach</button>
  <button data-tab="stats">Auswertung</button>
</section>

<section id="setNav" class="card setnav"></section>
<section id="flow" class="card"><h2>Bereit</h2><p>Spiel einrichten und starten.</p></section>
<section id="recent" class="card"></section>
</main>

<nav class="bottom">
  <button id="undo">↶ Undo</button>
  <button id="scoreFix">± Punkt</button>
  <button id="substitute">⇄ Wechsel</button>
  <button id="timeout">⏱ Auszeit</button>
  <button id="nextSet">Satz +</button>
</nav>
<div id="modal" class="modal hidden"><div id="modalBox" class="modalbox"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
