<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest"><title>EVV QuickScout V6.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;padding-bottom:72px}
header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:9px 11px}.score{display:flex;justify-content:space-between;font-size:25px;font-weight:900}.meta{display:flex;justify-content:space-between;font-size:12px;margin-top:3px}
main{max-width:760px;margin:auto;padding:8px}.card{background:white;border-radius:14px;padding:11px;margin:7px 0}h2{font-size:18px;margin:2px 0 8px}h3{font-size:15px;margin:10px 0 5px}
button{border:0;border-radius:11px;min-height:49px;padding:7px;font-size:14px;font-weight:800;background:#e5e7eb;color:#111827;touch-action:manipulation}.dark{background:#111827;color:#fff}.good{background:#dcfce7}.bad{background:#fee2e2}.blue{background:#dbeafe}.warn{background:#fef3c7}
.g2,.g3,.g4,.tabs{display:grid;gap:6px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4,.tabs{grid-template-columns:repeat(4,1fr)}
input{width:100%;font-size:17px;padding:10px;border:1px solid #cbd5e1;border-radius:9px;margin:4px 0 8px}.small{font-size:12px;color:#64748b}.hidden{display:none}
.r{display:grid;grid-template-columns:78px repeat(4,1fr);gap:4px;align-items:center;margin:4px 0}.r button{min-height:42px;font-size:12px;padding:3px}
.metric{background:#f8fafc;border-radius:10px;padding:8px;text-align:center}.metric b{font-size:21px;display:block}.metric span{font-size:11px;color:#64748b}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:9;background:white;border-top:1px solid #cbd5e1;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#toast{display:none;position:fixed;z-index:30;left:10px;right:10px;bottom:78px;background:#111827;color:white;padding:10px;border-radius:10px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 3px;border-bottom:1px solid #e5e7eb;text-align:right}th:first-child,td:first-child{text-align:left}
</style></head><body>
<header><div class=score><span>EVV <span id=e>0</span></span><span><span id=o>0</span> <span id=oppH>Gegner</span></span></div>
<div class=meta><span>Satz <b id=set>1</b> · <b id=rot>R1</b></span><span id=srv>EVV Aufschlag</span></div></header>
<main>
<section id=setup class=card><h2>Spiel einrichten</h2><label>Gegner<input id=oppName value="Dürener TV III"></label>
<div class=small>EVV: Johann · Michael · Janik · Jonas · Maksym · Dirk · Felix · Jens</div>
<div class=g2><button id=startRec class=dark>Start Annahme · R2</button><button id=startSrv class=dark>Start Aufschlag · R1</button></div></section>
<section class=card><div class=tabs><button id=tLive class=dark>LIVE</button><button id=tOpp>Gegner</button><button id=tStats>Quoten</button><button id=tTO>Auszeit</button></div></section>
<section id=flow class=card><h2>Bereit</h2></section><section id=coach class=card></section>
</main>
<div class=bottom><button id=undo>↶ UNDO</button><button id=fix>± Punkt</button><button id=toBtn class=warn>⏱ Auszeit</button><button id=newSet>Satz +</button></div><div id=toast></div>
<script>
(function(){
var NEXT={1:6,6:5,5:4,4:3,3:2,2:1}, P=["Johann","Michael","Janik","Jonas","Maksym","Dirk","Felix","Jens"];
var SERVER={1:"Johann",6:"Michael",5:"Janik",4:"Jonas",3:"Maksym",2:"Dirk"};
/* Post-release attack options, max 4. HF options are explicit tactical options, not fillers. */
var ATT={
1:[["Michael","IV"],["Janik","III"],["Jonas","II"],["Maksym","HF"]],
6:[["Maksym","IV"],["Janik","III"],["Jonas","II"],["Michael","HF"]],
5:[["Maksym","IV"],["Dirk","III"],["Jonas","II"],["Michael","HF"]],
4:[["Maksym","IV"],["Dirk","III"],["Michael","HF"]],
3:[["Michael","IV"],["Dirk","III"],["Jonas","HF"]],
2:[["Michael","IV"],["Janik","III"],["Jonas","HF"],["Maksym","HF"]]
};
var REC=["Michael","Maksym","Felix"], oppName="Dürener TV III", mode="live", draft={};
var st={e:0,o:0,set:1,rot:1,serving:true,started:false,rallies:[],history:[],timeouts:[]};
function E(x){return document.getElementById(x)} function C(x){return JSON.parse(JSON.stringify(x))}
function pct(a,b){return b?Math.round(100*a/b):0} function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function toast(s){E("toast").textContent=s;E("toast").style.display="block";setTimeout(function(){E("toast").style.display="none"},850)}
function snap(){return C({e:st.e,o:st.o,set:st.set,rot:st.rot,serving:st.serving,started:st.started,rallies:st.rallies,timeouts:st.timeouts})}
function restore(x){st.e=x.e;st.o=x.o;st.set=x.set;st.rot=x.rot;st.serving=x.serving;st.started=x.started;st.rallies=x.rallies;st.timeouts=x.timeouts||[]}
function save(){try{localStorage.setItem("EVV_QS_V61",JSON.stringify({st:st,oppName:oppName}))}catch(e){}}
function commit(w,d){st.history.push(snap());var b=st.e+":"+st.o,rb=st.rot,sb=st.serving;
 if(w==="EVV"){st.e++;if(!st.serving){st.serving=true;st.rot=NEXT[st.rot]}}else{st.o++;if(st.serving)st.serving=false}
 d=d||{};d.winner=w;d.before=b;d.after=st.e+":"+st.o;d.rot=rb;d.servingBefore=sb;d.set=st.set;d.seq=st.rallies.length+1;st.rallies.push(d);draft={};save();render();toast(b+" → "+d.after)}
function B(t,a,c){return '<button class="'+(c||"")+'" data-a="'+a+'">'+t+'</button>'}
function bind(){var q=document.querySelectorAll("[data-a]");for(var i=0;i<q.length;i++)q[i].onclick=function(){act(this.getAttribute("data-a"))}}
function act(s){var a=s.split("|");
 if(a[0]=="rec"){if(a[2]=="A0"){commit("Gegner",{kind:"K1",receiver:a[1],reception:"A0",setter:"Johann"});return}draft={step:2,kind:"K1",receiver:a[1],reception:a[2],setter:"Johann"};render()}
 else if(a[0]=="att"){draft.attacker=a[1];draft.zone=a[2];draft.step=3;render()}
 else if(a[0]=="ar"){var d=C(draft);d.attackResult=a[1];commit(a[2],d)}
 else if(a[0]=="srv"){if(a[1]=="ACE")commit("EVV",{kind:"Serve",server:SERVER[st.rot],serve:"ACE"});else if(a[1]=="ERR")commit("Gegner",{kind:"Serve",server:SERVER[st.rot],serve:"ERROR"});else{draft={step:2,kind:"Serve",server:SERVER[st.rot],serve:"IN"};render()}}
 else if(a[0]=="k2"){draft.player=a[1];draft.action=a[2];draft.step=3;render()}
 else if(a[0]=="win"){commit(a[1],C(draft))}
 else if(a[0]=="q"){commit(a[1],{kind:"Quick"})}
}
function live(){
 if(!st.started){E("flow").innerHTML="<h2>Bereit</h2><div class=small>Startart wählen.</div>";return}
 if(!st.serving){
  if(!draft.step){var h="<h2>K1 · 1/3 Annahme</h2>";REC.forEach(function(p){h+='<div class=r><b>'+p+'</b>';["A3","A2","A1","A0"].forEach(function(q){h+=B(q,"rec|"+p+"|"+q,q=="A3"?"good":q=="A0"?"bad":"")});h+="</div>"});h+='<div class=g3>'+B("Gegner AF","q|EVV","good")+B("Quick EVV","q|EVV")+B("Quick Gegner","q|Gegner")+"</div>";E("flow").innerHTML=h}
  else if(draft.step==2){var h2="<h2>"+draft.receiver+" "+draft.reception+" → Johann</h2><div class=small>2/3 · verfügbare Angriffsoptionen R"+st.rot+"</div><div class=g2>";ATT[st.rot].forEach(function(x){h2+=B(x[0]+" · "+x[1],"att|"+x[0]+"|"+x[1],"blue")});E("flow").innerHTML=h2+"</div>"}
  else E("flow").innerHTML="<h2>"+draft.attacker+" · "+draft.zone+"</h2><div class=small>3/3 · Ergebnis</div><div class=g2>"+B("KILL","ar|KILL|EVV","good")+B("FEHLER","ar|ERROR|Gegner","bad")+B("GEBLOCKT","ar|BLOCKED|Gegner","bad")+B("WEITER +","ar|CONT+|EVV")+B("WEITER −","ar|CONT-|Gegner")+"</div>"
 }else{
  if(!draft.step)E("flow").innerHTML="<h2>K2 · "+SERVER[st.rot]+" Aufschlag</h2><div class=small>1/3 · Aufschläger automatisch aus Rotation</div><div class=g3>"+B("ASS","srv|ACE","good")+B("FEHLER","srv|ERR","bad")+B("IM SPIEL","srv|IN","blue")+"</div>";
  else if(draft.step==2){var h3="<h2>K2 · 2/3 entscheidende Aktion</h2><div class=g2>";P.forEach(function(p){["BLOCK","ABWEHR","ANGRIFF"].forEach(function(x){h3+=B(p+" · "+x,"k2|"+p+"|"+x)})});E("flow").innerHTML=h3+"</div>"}
  else E("flow").innerHTML="<h2>K2 · 3/3 Ergebnis</h2><div class=g2>"+B("EVV Punkt","win|EVV","good")+B("Gegner Punkt","win|Gegner","bad")+"</div>"
 }bind()
}
function calc(rows){
 var x={recN:0,recPos:0,k1:0,k1w:0,attN:0,k:0,ae:0,ab:0,servN:0,aces:0,se:0,blocks:0,z:{},p:{}};
 ["IV","III","II","HF"].forEach(function(z){x.z[z]={n:0,k:0,e:0,b:0}});P.forEach(function(p){x.p[p]={rn:0,rp:0,an:0,k:0,e:0,b:0,sn:0,ace:0,se:0,blk:0}});
 (rows||st.rallies).forEach(function(r){
  if(r.kind=="K1"){x.k1++;if(r.winner=="EVV")x.k1w++;if(r.reception){x.recN++;if(r.reception=="A3"||r.reception=="A2")x.recPos++;var pr=x.p[r.receiver];if(pr){pr.rn++;if(r.reception=="A3"||r.reception=="A2")pr.rp++}}
   if(r.attacker&&r.attackResult){x.attN++;var pa=x.p[r.attacker],z=x.z[r.zone];pa.an++;z.n++;if(r.attackResult=="KILL"){x.k++;pa.k++;z.k++}if(r.attackResult=="ERROR"){x.ae++;pa.e++;z.e++}if(r.attackResult=="BLOCKED"){x.ab++;pa.b++;z.b++}}}
  if(r.kind=="Serve"){x.servN++;var ps=x.p[r.server];if(ps)ps.sn++;if(r.serve=="ACE"){x.aces++;if(ps)ps.ace++}if(r.serve=="ERROR"){x.se++;if(ps)ps.se++}}
  if(r.action=="BLOCK"&&r.winner=="EVV"){x.blocks++;if(x.p[r.player])x.p[r.player].blk++}
 });return x
}
function metrics(x){return '<div class=g4><div class=metric><b>'+pct(x.recPos,x.recN)+'%</b><span>Annahme +</span></div><div class=metric><b>'+pct(x.k,x.attN)+'%</b><span>Kill</span></div><div class=metric><b>'+pct(x.k1w,x.k1)+'%</b><span>K1</span></div><div class=metric><b>'+x.blocks+'</b><span>Blockpunkte</span></div></div>'}
function stats(){var x=calc(),h="<h2>Quoten</h2>"+metrics(x)+"<h3>Angriff nach Position</h3><table><tr><th>Zone</th><th>N</th><th>Kill%</th><th>Eff.</th></tr>";
 ["IV","III","II","HF"].forEach(function(z){var a=x.z[z];h+="<tr><td>"+z+"</td><td>"+a.n+"</td><td>"+pct(a.k,a.n)+"%</td><td>"+pct(a.k-a.e-a.b,a.n)+"%</td></tr>"});h+="</table><h3>Spieler</h3><table><tr><th>Spieler</th><th>Ann+</th><th>Kill</th><th>Eff</th><th>Ass</th><th>AF</th><th>Blk</th></tr>";
 P.forEach(function(n){var p=x.p[n];h+="<tr><td>"+n+"</td><td>"+(p.rn?pct(p.rp,p.rn)+"%":"–")+"</td><td>"+(p.an?pct(p.k,p.an)+"%":"–")+"</td><td>"+(p.an?pct(p.k-p.e-p.b,p.an)+"%":"–")+"</td><td>"+p.ace+"</td><td>"+p.se+"</td><td>"+p.blk+"</td></tr>"});E("flow").innerHTML=h+"</table><p class=small>Angriffseffizienz = (Kills − Fehler − direkt geblockt) / Versuche. Block als Anzahl, solange nicht jeder Blockversuch erfasst wird.</p>"}
function toView(){
 var all=calc(),lastRows=st.rallies.slice(-6),last=calc(lastRows),sinceRows=st.timeouts.length?st.rallies.slice(st.timeouts[st.timeouts.length-1].rally):st.rallies,lastTO=calc(sinceRows);
 var hints=[],zones=[];["IV","III","II","HF"].forEach(function(z){var a=all.z[z];if(a.n>=3)zones.push({z:z,k:pct(a.k,a.n),n:a.n})});zones.sort(function(a,b){return b.k-a.k});
 if(all.recN>=5&&pct(all.recPos,all.recN)>=60&&pct(all.k1w,all.k1)<45)hints.push("Annahme stabil, K1 schwach → Verteilung/Abschluss prüfen.");
 if(zones.length>1&&zones[0].k-zones[zones.length-1].k>=20)hints.push(zones[0].z+" "+zones[0].k+"% Kill vs. "+zones[zones.length-1].z+" "+zones[zones.length-1].k+"% → Verteilung prüfen.");
 if(all.servN>=5&&pct(all.se,all.servN)>=20)hints.push("Aufschlagfehler "+pct(all.se,all.servN)+"% → Risiko prüfen.");
 if(!hints.length)hints.push("Noch kein belastbares Änderungssignal.");
 E("flow").innerHTML="<h2>⏱ Timeout-Cockpit · "+st.e+":"+st.o+"</h2><h3>Satz</h3>"+metrics(all)+"<h3>Letzte 6 Rallyes</h3>"+metrics(last)+"<h3>Seit letzter Auszeit</h3>"+metrics(lastTO)+"<h3>Metrische Unterstützung</h3><p>"+hints.join("<br>")+"</p><div class=small>Hinweise erst bei Mindeststichprobe; Entscheidung bleibt beim Trainer.</div>"
}
function render(){E("e").textContent=st.e;E("o").textContent=st.o;E("set").textContent=st.set;E("rot").textContent="R"+st.rot;E("srv").textContent=st.serving?"EVV Aufschlag":"Gegner Aufschlag";E("oppH").textContent=oppName;E("setup").className=st.started?"card hidden":"card";if(mode=="live")live();else if(mode=="stats")stats();else if(mode=="to")toView();else E("flow").innerHTML="<h2>Gegner-Scout</h2><div class=small>Für V6.1 bewusst getrennt vom Live-Rallye-Commit, damit kein Punkt doppelt gezählt wird. Gegnerdetail folgt nach Live-Logiktest.</div>";var x=calc();E("coach").innerHTML="<h2>Match Coach</h2><div class=small>Annahme + "+pct(x.recPos,x.recN)+"% · Kill "+pct(x.k,x.attN)+"% · K1 "+pct(x.k1w,x.k1)+"% · Aufschlagfehler "+pct(x.se,x.servN)+"%</div>"}
function start(serv){oppName=E("oppName").value||"Gegner";st={e:0,o:0,set:1,rot:serv?1:2,serving:serv,started:true,rallies:[],history:[],timeouts:[]};draft={};mode="live";save();render()}
E("startRec").onclick=function(){start(false)};E("startSrv").onclick=function(){start(true)};
E("tLive").onclick=function(){mode="live";draft={};render()};E("tOpp").onclick=function(){mode="opp";draft={};render()};E("tStats").onclick=function(){mode="stats";draft={};render()};E("tTO").onclick=function(){mode="to";draft={};render()};
E("toBtn").onclick=function(){st.timeouts.push({set:st.set,score:st.e+":"+st.o,rally:st.rallies.length});save();mode="to";render()};
E("undo").onclick=function(){if(!st.history.length){toast("Nichts zum Undo");return}var h=st.history.pop();restore(h);draft={};save();render();toast("Rallye vollständig zurückgesetzt")};
E("fix").onclick=function(){E("flow").innerHTML='<h2>Punkt korrigieren</h2><div class=g2><button id=ep>EVV +1</button><button id=em>EVV −1</button><button id=op>Gegner +1</button><button id=om>Gegner −1</button></div>';E("ep").onclick=function(){st.e++;save();render()};E("em").onclick=function(){st.e=Math.max(0,st.e-1);save();render()};E("op").onclick=function(){st.o++;save();render()};E("om").onclick=function(){st.o=Math.max(0,st.o-1);save();render()}};
E("newSet").onclick=function(){st.set++;st.e=0;st.o=0;st.rot=2;st.serving=false;draft={};save();mode="live";render();toast("Neuer Satz · Annahme R2")};render();
})();
</script><script>if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0){addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script></body></html>
