*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#eef2f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}.top{z-index:20;background:#111827;color:#fff;padding:7px max(10px,env(safe-area-inset-right)) 7px max(10px,env(safe-area-inset-left));position:relative}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-weight:900}.team{font-size:clamp(17px,3vw,24px)}.team.right{text-align:right}.centerScore{font-size:clamp(28px,5vw,40px);letter-spacing:1px;white-space:nowrap}.meta{display:flex;justify-content:center;gap:12px;font-size:12px;margin-top:2px}.ver{position:absolute;right:8px;bottom:3px;font-size:9px;opacity:.65}.content{overflow:auto;-webkit-overflow-scrolling:touch;padding:7px 8px 12px}.wrap{max-width:820px;margin:auto}.card{background:#fff;border-radius:14px;padding:10px;margin:6px 0}h2{font-size:17px;margin:2px 0 7px}h3{font-size:14px;margin:9px 0 4px}.tabs,.g2,.g3,.g4{display:grid;gap:5px}.tabs,.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}button{border:0;border-radius:10px;min-height:46px;padding:6px;font-size:13px;font-weight:800;background:#e5e7eb;color:#111827;touch-action:manipulation}.dark{background:#111827;color:#fff}.good{background:#dcfce7}.bad{background:#fee2e2}.blue{background:#dbeafe}.warn{background:#fef3c7}.small{font-size:11px;color:#64748b}.hidden{display:none}.r{display:grid;grid-template-columns:72px repeat(4,1fr);gap:4px;align-items:center;margin:4px 0}.r button{min-height:40px;font-size:11px;padding:3px}.metric{background:#f8fafc;border-radius:10px;padding:7px;text-align:center}.metric b{font-size:19px;display:block}.metric span{font-size:10px;color:#64748b}.bottom{z-index:20;background:#fff;border-top:1px solid #cbd5e1;padding:5px max(6px,env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.bottom button{min-height:44px}.path{font-size:11px;background:#e2e8f0;border-radius:8px;padding:6px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#toast{display:none;position:fixed;z-index:40;left:10px;right:10px;bottom:68px;background:#111827;color:#fff;padding:9px;border-radius:10px;text-align:center}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:5px 3px;border-bottom:1px solid #e5e7eb;text-align:right}th:first-child,td:first-child{text-align:left}.seg{display:flex;gap:4px;margin-bottom:5px}.seg button{min-height:34px;flex:1}.active{outline:2px solid #2563eb}.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px 0}.pair .label{grid-column:1/-1;font-size:11px;font-weight:800;color:#475569}.note{padding:7px;border-radius:8px;background:#f8fafc;font-size:11px;color:#475569}@media(max-width:560px){.team{font-size:15px}.centerScore{font-size:29px}.tabs button{font-size:11px}.r{grid-template-columns:62px repeat(4,1fr)}.content{padding:5px}.card{padding:8px}.bottom button{font-size:11px}}
</style></head><body><div class="app"><header class="top"><div class="score"><div class="team">EVV</div><div class="centerScore"><span id=e>0</span> : <span id=o>0</span></div><div class="team right" id=oppH>Gegner</div></div><div class=meta><span>Satz <b id=set>1</b></span><span><b id=rot>R1</b></span><span id=srv>EVV Aufschlag</span></div><div class=ver>V7.0 TEST</div></header><div class=content><main class=wrap><section id=setup class=card><h2>Spiel einrichten</h2><input id=oppName value="Dürener TV III" style="width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:7px"><div class=g2><button id=startRec class=dark>Start Annahme · R2</button><button id=startSrv class=dark>Start Aufschlag · R1</button></div></section><section class=card><div class=tabs><button id=tLive class=dark>LIVE</button><button id=tOpp>Gegner</button><button id=tStats>Quoten</button><button id=tTO>Auszeit</button></div><div id=path class=path>Bereit</div></section><section id=flow class=card><h2>Bereit</h2></section><section id=coach class=card></section></main></div><footer class=bottom><button id=undo>↶ UNDO</button><button id=fix>± Punkt</button><button id=toBtn class=warn>⏱ Auszeit</button><button id=newSet>Satz +</button></footer></div><div id=toast></div><script>
(function(){
const NEXT={1:6,6:5,5:4,4:3,3:2,2:1}, P=["Johann","Michael","Janik","Jonas","Maksym","Dirk","Felix","Jens"];
const SERVER={1:"Johann",6:"Michael",5:"Janik",4:"Jonas",3:"Maksym",2:"Dirk"};
const ATT={1:[["Michael","IV"],["Janik","III"],["Jonas","II"],["Maksym","HF"]],6:[["Maksym","IV"],["Janik","III"],["Jonas","II"],["Michael","HF"]],5:[["Maksym","IV"],["Dirk","III"],["Jonas","II"],["Michael","HF"]],4:[["Maksym","IV"],["Dirk","III"],["Johann","II"],["Michael","HF"]],3:[["Michael","IV"],["Dirk","III"],["Johann","II"],["Jonas","HF"]],2:[["Michael","IV"],["Janik","III"],["Johann","II"],["Jonas","HF"]]};
const FR={1:[["Michael","IV"],["Janik","III"],["Jonas","II"]],6:[["Maksym","IV"],["Janik","III"],["Jonas","II"]],5:[["Maksym","IV"],["Dirk","III"],["Jonas","II"]],4:[["Maksym","IV"],["Dirk","III"],["Johann","II"]],3:[["Michael","IV"],["Dirk","III"],["Johann","II"]],2:[["Michael","IV"],["Janik","III"],["Johann","II"]]};
const REC={1:["Jonas","Maksym","Felix"],2:["Jonas","Maksym","Felix"],3:["Jonas","Michael","Felix"],4:["Jonas","Maksym","Felix"],5:["Jonas","Maksym","Felix"],6:["Jonas","Maksym","Felix"]};
let oppName="Dürener TV III",mode="live",draft={},statScope="match";let st={e:0,o:0,set:1,rot:1,serving:true,started:false,rallies:[],history:[],timeouts:[]};
const E=x=>document.getElementById(x), C=x=>JSON.parse(JSON.stringify(x)), pct=(a,b)=>b?Math.round(100*a/b):0, rate=(a,b)=>b?pct(a,b)+"% ("+a+"/"+b+")":"–";
function toast(s){E('toast').textContent=s;E('toast').style.display='block';setTimeout(()=>E('toast').style.display='none',900)}
function snap(){return C({e:st.e,o:st.o,set:st.set,rot:st.rot,serving:st.serving,started:st.started,rallies:st.rallies,timeouts:st.timeouts})} function restore(x){Object.assign(st,x)}
function save(){localStorage.setItem('EVV_QS_V70',JSON.stringify({st,oppName}))}
function pathText(d){if(!d)return 'Bereit';let a=[];if(d.server)a.push(d.server+' Aufschlag '+(d.serve||''));if(d.receiver)a.push(d.receiver+' '+d.reception);if(d.defender)a.push('Abwehr '+d.defender);if(d.player&&d.action&&d.action.startsWith('BLOCK'))a.push(d.action+' '+d.player+' '+(d.zone||''));if(d.attacker)a.push(d.attacker+' '+d.zone+' '+(d.attackResult||''));if(d.kind==='Quick')a.push('Quick '+d.winner);return a.join(' → ')||d.kind}
function commit(w,d){st.history.push(snap());let b=st.e+':'+st.o,rb=st.rot,sb=st.serving;if(w==='EVV'){st.e++;if(!st.serving){st.serving=true;st.rot=NEXT[st.rot]}}else{st.o++;if(st.serving)st.serving=false}d=d||{};Object.assign(d,{winner:w,before:b,after:st.e+':'+st.o,rot:rb,servingBefore:sb,set:st.set,seq:st.rallies.length+1});st.rallies.push(d);draft={};save();render();toast(b+' → '+d.after)}
const B=(t,a,c='')=>'<button class="'+c+'" data-a="'+a+'">'+t+'</button>';function bind(){document.querySelectorAll('[data-a]').forEach(q=>q.onclick=()=>act(q.dataset.a))}
function attackPick(title){let h='<h2>'+title+'</h2><div class="small">Angriff rotationsabhängig · R'+st.rot+'</div><div class=g2>';ATT[st.rot].forEach(x=>h+=B(x[0]+' · '+x[1],'att|'+x[0]+'|'+x[1],'blue'));E('flow').innerHTML=h+'</div>'}
function act(s){let a=s.split('|');if(a[0]==='rec'){if(a[2]==='A0'){commit('Gegner',{kind:'K1',receiver:a[1],reception:'A0'});return}draft={step:'att',kind:'K1',receiver:a[1],reception:a[2]};render()}
else if(a[0]==='att'){draft.attacker=a[1];draft.zone=a[2];draft.step='result';render()}
else if(a[0]==='ar'){let d=C(draft);d.attackResult=a[1];commit(a[2],d)}
else if(a[0]==='srv'){if(a[1]==='ACE')commit('EVV',{kind:'Serve',server:SERVER[st.rot],serve:'ACE'});else if(a[1]==='ERR')commit('Gegner',{kind:'Serve',server:SERVER[st.rot],serve:'ERROR'});else{draft={step:'k2action',kind:'Serve',server:SERVER[st.rot],serve:'IN'};render()}}
else if(a[0]==='bp'){commit('EVV',{kind:'Serve',server:draft.server,serve:'IN',player:a[1],zone:a[2],action:'BLOCK_POINT'})}
else if(a[0]==='bo'){commit('Gegner',{kind:'Serve',server:draft.server,serve:'IN',player:a[1],zone:a[2],action:'BLOCK_OUT'})}
else if(a[0]==='def'){draft.defender=a[1];draft.action='DEFENSE';draft.step='att';render()}
else if(a[0]==='k2att'){draft.attacker=a[1];draft.zone=a[2];draft.action='ATTACK';draft.step='result';render()}
else if(a[0]==='q'){commit(a[1],{kind:'Quick',source:a[2]||'',winner:a[1]})}}
function live(){if(!st.started){E('flow').innerHTML='<h2>Bereit</h2>';return}if(!st.serving){if(!draft.step){let h='<h2>K1 · 1/3 Annahme</h2>';REC[st.rot].forEach(p=>{h+='<div class=r><b>'+p+'</b>';['A3','A2','A1','A0'].forEach(q=>h+=B(q,'rec|'+p+'|'+q,q==='A3'?'good':q==='A0'?'bad':''));h+='</div>'});h+='<div class=g3>'+B('Gegner AF','q|EVV|OPP_SERVE_ERROR','good')+B('Quick EVV','q|EVV')+B('Quick Gegner','q|Gegner')+'</div>';E('flow').innerHTML=h}else if(draft.step==='att')attackPick('K1 · Angriff');else resultView()}
else{if(!draft.step)E('flow').innerHTML='<h2>K2 · '+SERVER[st.rot]+' Aufschlag</h2><div class="small">1 · Aufschläger automatisch aus Rotation</div><div class=g3>'+B('ASS','srv|ACE','good')+B('FEHLER','srv|ERR','bad')+B('IM SPIEL','srv|IN','blue')+'</div>';else if(draft.step==='k2action'){let h='<h2>K2 · Aktion</h2><div class="small">Block ist Abschluss · Abwehr führt zurück zum Angriff</div>';FR[st.rot].forEach(x=>h+='<div class=pair><div class=label>'+x[0]+' · '+x[1]+'</div>'+B('BLOCKPUNKT','bp|'+x[0]+'|'+x[1],'good')+B('BLOCK-OUT','bo|'+x[0]+'|'+x[1],'bad')+'</div>');h+='<div class=g2>';ATT[st.rot].forEach(x=>h+=B('ANGRIFF '+x[0]+' · '+x[1],'k2att|'+x[0]+'|'+x[1]));h+=B('ABWEHR Felix','def|Felix','blue')+B('ABWEHR Feld','def|Feld','blue')+'</div>';E('flow').innerHTML=h}else if(draft.step==='att')attackPick('K2 · nach Abwehr');else resultView()}bind()}
function resultView(){E('flow').innerHTML='<h2>'+draft.attacker+' · '+draft.zone+'</h2><div class="small">Angriffsergebnis</div><div class=g2>'+B('KILL','ar|KILL|EVV','good')+B('FEHLER','ar|ERROR|Gegner','bad')+B('GEBLOCKT','ar|BLOCKED|Gegner','bad')+B('WEITER +','ar|CONT+|EVV')+B('WEITER −','ar|CONT-|Gegner')+'</div>'}
function calc(rows){let x={recN:0,recPos:0,k1:0,k1w:0,attN:0,k:0,ae:0,ab:0,servN:0,aces:0,se:0,oppSE:0,bp:0,bo:0,defN:0,z:{},p:{}};['IV','III','II','HF'].forEach(z=>x.z[z]={n:0,k:0,e:0,b:0});P.forEach(p=>x.p[p]={rn:0,rp:0,an:0,k:0,e:0,b:0,sn:0,ace:0,se:0,bp:0,bo:0,dn:0,dw:0});(rows||st.rallies).forEach(r=>{if(r.source==='OPP_SERVE_ERROR')x.oppSE++;if(r.kind==='K1'){x.k1++;if(r.winner==='EVV')x.k1w++;if(r.reception){x.recN++;if(['A3','A2'].includes(r.reception))x.recPos++;let p=x.p[r.receiver];if(p){p.rn++;if(['A3','A2'].includes(r.reception))p.rp++}}}if(r.attacker&&r.attackResult){x.attN++;let p=x.p[r.attacker],z=x.z[r.zone];if(p)p.an++;if(z)z.n++;if(r.attackResult==='KILL'){x.k++;if(p)p.k++;if(z)z.k++}if(r.attackResult==='ERROR'){x.ae++;if(p)p.e++;if(z)z.e++}if(r.attackResult==='BLOCKED'){x.ab++;if(p)p.b++;if(z)z.b++}}if(r.kind==='Serve'){x.servN++;let p=x.p[r.server];if(p)p.sn++;if(r.serve==='ACE'){x.aces++;if(p)p.ace++}if(r.serve==='ERROR'){x.se++;if(p)p.se++}}if(r.action==='BLOCK_POINT'){x.bp++;if(x.p[r.player])x.p[r.player].bp++}if(r.action==='BLOCK_OUT'){x.bo++;if(x.p[r.player])x.p[r.player].bo++}if(r.defender){x.defN++;if(x.p[r.defender]){x.p[r.defender].dn++;if(r.winner==='EVV')x.p[r.defender].dw++}}});return x}
function metrics(x){return '<div class=g4><div class=metric><b>'+rate(x.recPos,x.recN)+'</b><span>Annahme +</span></div><div class=metric><b>'+rate(x.k,x.attN)+'</b><span>Kill erfasst</span></div><div class=metric><b>'+rate(x.k1w,x.k1)+'</b><span>K1</span></div><div class=metric><b>'+x.bp+' / '+x.bo+'</b><span>BP / BO</span></div></div>'}
function rowsForScope(){return statScope==='set'?st.rallies.filter(r=>r.set===st.set):st.rallies}
function stats(){let x=calc(rowsForScope()),h='<h2>Quoten</h2><div class=seg><button data-scope="match" class="'+(statScope==='match'?'active':'')+'">Match gesamt</button><button data-scope="set" class="'+(statScope==='set'?'active':'')+'">Satz '+st.set+'</button></div>'+metrics(x)+'<div class=note>Aufschlag: Ass '+rate(x.aces,x.servN)+' · AF '+rate(x.se,x.servN)+' · Gegner AF '+x.oppSE+'</div><h3>Angriff nach Position</h3><table><tr><th>Zone</th><th>N</th><th>Kill</th><th>Eff.</th></tr>';['IV','III','II','HF'].forEach(z=>{let a=x.z[z];h+='<tr><td>'+z+'</td><td>'+a.n+'</td><td>'+rate(a.k,a.n)+'</td><td>'+(a.n?pct(a.k-a.e-a.b,a.n)+'%':'–')+'</td></tr>'});h+='</table><h3>Spieler</h3><table><tr><th>Spieler</th><th>Ann+</th><th>Kill</th><th>Eff</th><th>Ass</th><th>AF</th><th>BP</th><th>BO</th><th>Abw+</th></tr>';P.forEach(n=>{let p=x.p[n];h+='<tr><td>'+n+'</td><td>'+rate(p.rp,p.rn)+'</td><td>'+rate(p.k,p.an)+'</td><td>'+(p.an?pct(p.k-p.e-p.b,p.an)+'%':'–')+'</td><td>'+p.ace+'</td><td>'+p.se+'</td><td>'+p.bp+'</td><td>'+p.bo+'</td><td>'+rate(p.dw,p.dn)+'</td></tr>'});E('flow').innerHTML=h+'</table><p class=small>Angriffswerte beziehen sich auf erfasste Angriffe. BP/BO sind Abschlussereignisse, keine Blockquote.</p>';document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{statScope=b.dataset.scope;stats()})}
function toView(){let rows=st.rallies.filter(r=>r.set===st.set),all=calc(rows),last=calc(rows.slice(-6)),since=calc(st.timeouts.length?rows.slice(st.timeouts[st.timeouts.length-1].set===st.set?st.timeouts[st.timeouts.length-1].setIndex:0):rows);E('flow').innerHTML='<h2>⏱ Timeout · '+st.e+':'+st.o+'</h2><h3>Aktueller Satz</h3>'+metrics(all)+'<h3>Letzte 6 Rallyes</h3>'+metrics(last)+'<h3>Seit letzter Auszeit</h3>'+metrics(since)}
function render(){E('e').textContent=st.e;E('o').textContent=st.o;E('set').textContent=st.set;E('rot').textContent='R'+st.rot;E('srv').textContent=st.serving?'EVV Aufschlag':'Gegner Aufschlag';E('oppH').textContent=oppName;E('setup').className=st.started?'card hidden':'card';let last=st.rallies[st.rallies.length-1];E('path').textContent=last?'Letzte Rallye: '+pathText(last):'Bereit';['tLive','tOpp','tStats','tTO'].forEach(id=>E(id).classList.remove('dark'));E(mode==='live'?'tLive':mode==='stats'?'tStats':mode==='to'?'tTO':'tOpp').classList.add('dark');if(mode==='live')live();else if(mode==='stats')stats();else if(mode==='to')toView();else E('flow').innerHTML='<h2>Gegner-Scout</h2><div class=note>Live-Gegnerdetail bleibt getrennt, damit keine Rallye doppelt gezählt wird.</div>';let x=calc(st.rallies);E('coach').innerHTML='<h2>Match Coach</h2><div class=small>Annahme '+rate(x.recPos,x.recN)+' · Kill '+rate(x.k,x.attN)+' · K1 '+rate(x.k1w,x.k1)+' · Ass '+rate(x.aces,x.servN)+' · AF '+rate(x.se,x.servN)+' · BP/BO '+x.bp+'/'+x.bo+'</div>'}
function start(serv){oppName=E('oppName').value||'Gegner';st={e:0,o:0,set:1,rot:serv?1:2,serving:serv,started:true,rallies:[],history:[],timeouts:[]};draft={};mode='live';save();render()}
E('startRec').onclick=()=>start(false);E('startSrv').onclick=()=>start(true);E('tLive').onclick=()=>{mode='live';draft={};render()};E('tOpp').onclick=()=>{mode='opp';draft={};render()};E('tStats').onclick=()=>{mode='stats';draft={};render()};E('tTO').onclick=()=>{mode='to';draft={};render()};E('toBtn').onclick=()=>{let setRows=st.rallies.filter(r=>r.set===st.set);st.timeouts.push({set:st.set,setIndex:setRows.length});save();mode='to';render()};E('undo').onclick=()=>{if(!st.history.length){toast('Nichts zum Undo');return}let h=st.history.pop(),hist=st.history;restore(h);st.history=hist;draft={};save();render();toast('Letzte Rallye vollständig zurückgesetzt')};E('fix').onclick=()=>{E('flow').innerHTML='<h2>Punkt korrigieren</h2><div class=g2><button id=ep>EVV +1</button><button id=em>EVV −1</button><button id=op>Gegner +1</button><button id=om>Gegner −1</button></div><div class=note>Nur Spielstand. Keine Rotation, kein Aufschlagrecht, keine Statistik.</div>';E('ep').onclick=()=>{st.e++;save();render()};E('em').onclick=()=>{st.e=Math.max(0,st.e-1);save();render()};E('op').onclick=()=>{st.o++;save();render()};E('om').onclick=()=>{st.o=Math.max(0,st.o-1);save();render()}};E('newSet').onclick=()=>{if(!st.started)return;st.set++;st.e=0;st.o=0;st.rot=2;st.serving=false;draft={};save();mode='live';render();toast('Satz '+st.set+' · Annahme R2')};render();
})();</script><script>if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
